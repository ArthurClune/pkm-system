[project]
name = "pkm-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx2>=2.5.0",
    "mcp>=1.28",
    "claude-agent-sdk>=0.2.161",
    "nh3>=0.3.7",
]

[project.scripts]
pkm = "pkm.cli.main:main"
pkm-mcp = "pkm.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyrefly>=1.1",
    "ruff>=0.15.20",
    "pytest-cov>=7.1.0",
    "time-machine>=3.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pkm --cov-branch --cov-report=term-missing --cov-fail-under=95"
pythonpath = ["tooling"]

[tool.ruff]
line-length = 120

[tool.uv]
# claude-agent-sdk is exempt from the global uv cooldown (exclude-newer =
# "5 days"). Its bundled CLI maps the assistant's model aliases to model ids,
# so a new Claude model reaches the assistant only through an SDK upgrade.
exclude-newer-package = { claude-agent-sdk = false }
