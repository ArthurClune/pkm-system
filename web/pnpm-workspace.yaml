allowBuilds:
  esbuild: true
# Force a single katex install: mermaid@11.16.1 asks for katex ^0.16.45,
# which otherwise ships as a second ~260KB lazy chunk alongside our direct
# katex@0.18.10 dependency.
overrides:
  katex: ^0.18.10
# pdfjs-dist is react-pdf's pinned dependency (deliberately NOT a direct
# dependency, so react-pdf's pin stays the single source of version truth).
# PdfViewer.tsx references its worker by bare specifier
# (new URL("pdfjs-dist/build/pdf.worker.min.mjs", import.meta.url)), which
# pnpm's strict layout would otherwise make unresolvable from app code.
publicHoistPattern:
  - pdfjs-dist
# pnpm's check for stale dependencies keys its state on the project path. A
# worktree's node_modules is a symlink to the main checkout's, so a script
# run there would look stale, install through the link and repoint the main
# checkout's packages at the worktree. Dependency changes are installed by
# hand instead (pnpm install --frozen-lockfile).
verifyDepsBeforeRun: false
