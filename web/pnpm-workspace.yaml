allowBuilds:
  esbuild: true
# Force a single katex install: mermaid@11.16.0 pins its own transitive
# katex@0.16.47, which otherwise ships as a second ~260KB lazy chunk
# alongside our direct katex@0.17.0 dependency (pkm-zotb).
overrides:
  katex: ^0.17.0
# pdfjs-dist is react-pdf's pinned dependency (deliberately NOT a direct
# dependency, so react-pdf's pin stays the single source of version truth).
# PdfViewer.tsx references its worker by bare specifier
# (new URL("pdfjs-dist/build/pdf.worker.min.mjs", import.meta.url)), which
# pnpm's strict layout would otherwise make unresolvable from app code.
publicHoistPattern:
  - pdfjs-dist
# The opfs-sahpool VFS answered xCheckReservedLock with 1 every time, so a
# killed worker's rollback journal was never played back; the patch reports
# RESERVED only when this pool holds it on the file. It is keyed to the exact
# version: an upgrade must carry it forward, or drop it once upstream fixes
# the VFS (docs/architecture/sync-and-offline.md, The replica).
patchedDependencies:
  '@sqlite.org/sqlite-wasm@3.53.0-build1': patches/@sqlite.org__sqlite-wasm@3.53.0-build1.patch
