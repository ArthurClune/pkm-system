[project]
name = "pkm-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx2>=2.5.0",
    "mcp>=1.28",
    "claude-agent-sdk>=0.2.161",
    "nh3>=0.3.7",
]

[project.scripts]
pkm = "pkm.cli.main:main"
pkm-mcp = "pkm.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyrefly>=1.1",
    "ruff>=0.15.20",
    "pytest-cov>=7.1.0",
    "time-machine>=3.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pkm --cov-branch --cov-report=term-missing --cov-fail-under=95"
pythonpath = ["tooling"]

[tool.ruff]
line-length = 120

[tool.uv]
# The global uv cooldown (exclude-newer = "5 days") held claude-agent-sdk at a
# bundled CLI whose `sonnet` alias still meant Sonnet 5. This pin admits 0.2.161
# (bundled CLI 2.1.284: opus -> claude-opus-5-5, sonnet -> claude-sonnet-5-5)
# and nothing later. Drop it once the global cooldown has caught up.
exclude-newer-package = { claude-agent-sdk = "2026-09-28T19:00:00Z" }
